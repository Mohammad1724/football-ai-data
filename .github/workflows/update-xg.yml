name: Update xG data

on:
  schedule:
    # Daily at 05:17 UTC — after the previous evening's matches are final.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-xg
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect xG data
        run: python3 collect_xg.py --out-dir data/xg

      - name: Collect availability data
        run: python3 collect_availability.py --out-dir data/availability

      - name: Commit new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/xg data/availability
          if git diff --cached --quiet; then
            echo "No new rows."
          else
            git commit -m "Update xG and availability data ($(date -u +%Y-%m-%d))"
            git push
          fi
